<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tetris</title>
<style>
  :root {
    --bg: #11131a;
    --panel: #1c1f2b;
    --border: #3a3f55;
    --text: #e8e9f0;
    --accent: #6ee7b7;
    --grid-line: #262a3a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    padding: 24px;
  }
  canvas {
    background: #0a0b10;
    border: 2px solid var(--border);
    border-radius: 6px;
    display: block;
  }
  .panel {
    width: 180px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }
  .box h2 {
    margin: 0 0 8px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #9aa0b4;
  }
  .stat {
    font-size: 22px;
    font-weight: 700;
  }
  #nextCanvas {
    width: 100%;
    height: 96px;
    background: #0a0b10;
    border-radius: 4px;
  }
  .controls {
    font-size: 12.5px;
    line-height: 1.7;
    color: #b7bbcf;
  }
  .controls kbd {
    background: #2a2e40;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 11, 16, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    border-radius: 6px;
    text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay h1 {
    margin: 0;
    font-size: 26px;
  }
  button {
    background: var(--accent);
    color: #0a0b10;
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .stage {
    position: relative;
  }
</style>
</head>
<body>
  <div class="layout">
    <div class="stage">
      <canvas id="board" width="240" height="480"></canvas>
      <div id="overlay">
        <h1 id="overlayTitle">Paused</h1>
        <button id="overlayBtn">Start</button>
      </div>
    </div>
    <div class="panel">
      <div class="box">
        <h2>Score</h2>
        <div class="stat" id="score">0</div>
      </div>
      <div class="box">
        <h2>Lines</h2>
        <div class="stat" id="lines">0</div>
      </div>
      <div class="box">
        <h2>Level</h2>
        <div class="stat" id="level">1</div>
      </div>
      <div class="box">
        <h2>Next</h2>
        <canvas id="nextCanvas" width="160" height="96"></canvas>
      </div>
      <div class="box controls">
        <h2>Controls</h2>
        <div><kbd>&larr;</kbd> <kbd>&rarr;</kbd> move</div>
        <div><kbd>&darr;</kbd> soft drop</div>
        <div><kbd>&uarr;</kbd> rotate</div>
        <div><kbd>space</kbd> hard drop</div>
        <div><kbd>p</kbd> pause</div>
      </div>
    </div>
  </div>

<script>
(() => {
  const COLS = 10, ROWS = 20, CELL = 24;
  const board = document.getElementById('board');
  const ctx = board.getContext('2d');
  const nextCanvas = document.getElementById('nextCanvas');
  const nextCtx = nextCanvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const linesEl = document.getElementById('lines');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayBtn = document.getElementById('overlayBtn');

  const COLORS = {
    I: '#5ee7f5',
    O: '#f5e05e',
    T: '#b35ef5',
    S: '#5ef58b',
    Z: '#f55e6c',
    J: '#5e78f5',
    L: '#f59b5e',
  };

  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]],
  };

  const TYPES = Object.keys(SHAPES);

  function rotateCells(cells) {
    // rotate around a 4x4 box center (1.5, 1.5): (x,y) -> (y, 3-x)
    return cells.map(([x, y]) => [y, 3 - x]);
  }

  function newPiece(type) {
    return {
      type,
      cells: SHAPES[type].map(c => c.slice()),
      x: 3,
      y: -1,
    };
  }

  function randomType() {
    return TYPES[Math.floor(Math.random() * TYPES.length)];
  }

  let grid, current, nextType, score, lines, level, dropInterval, dropTimer;
  let running = false, paused = false, gameOver = false;
  let rafId = null, lastTime = 0;

  function emptyGrid() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  function resetState() {
    grid = emptyGrid();
    score = 0;
    lines = 0;
    level = 1;
    dropInterval = 800;
    nextType = randomType();
    current = newPiece(randomType());
    gameOver = false;
    updateStats();
  }

  function updateStats() {
    scoreEl.textContent = score;
    linesEl.textContent = lines;
    levelEl.textContent = level;
  }

  function absCells(piece) {
    return piece.cells.map(([x, y]) => [piece.x + x, piece.y + y]);
  }

  function collides(piece, dx = 0, dy = 0, cells = null) {
    const test = cells || piece.cells;
    for (const [cx, cy] of test) {
      const x = piece.x + cx + dx;
      const y = piece.y + cy + dy;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function lockPiece() {
    for (const [x, y] of absCells(current)) {
      if (y < 0) {
        triggerGameOver();
        return;
      }
      grid[y][x] = current.type;
    }
    clearLines();
    current = newPiece(nextType);
    nextType = randomType();
    if (collides(current)) {
      triggerGameOver();
    }
    drawNext();
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(cell => cell)) {
        grid.splice(y, 1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      lines += cleared;
      level = 1 + Math.floor(lines / 10);
      dropInterval = Math.max(120, 800 - (level - 1) * 70);
      updateStats();
    }
  }

  function triggerGameOver() {
    gameOver = true;
    running = false;
    showOverlay('Game Over', 'Restart');
  }

  function move(dx, dy) {
    if (!collides(current, dx, dy)) {
      current.x += dx;
      current.y += dy;
      return true;
    }
    return false;
  }

  function softDrop() {
    if (!move(0, 1)) {
      lockPiece();
    } else {
      score += 1;
      updateStats();
    }
  }

  function hardDrop() {
    let dist = 0;
    while (move(0, 1)) dist++;
    score += dist * 2;
    updateStats();
    lockPiece();
  }

  function rotate() {
    const rotated = rotateCells(current.cells);
    const kicks = [0, -1, 1, -2, 2];
    for (const k of kicks) {
      if (!collides(current, k, 0, rotated)) {
        current.cells = rotated;
        current.x += k;
        return;
      }
    }
  }

  function drawCell(c, x, y, type, cellSize) {
    const px = x * cellSize, py = y * cellSize;
    c.fillStyle = COLORS[type];
    c.fillRect(px + 1, py + 1, cellSize - 2, cellSize - 2);
    c.strokeStyle = 'rgba(255,255,255,0.15)';
    c.strokeRect(px + 1, py + 1, cellSize - 2, cellSize - 2);
  }

  function draw() {
    ctx.clearRect(0, 0, board.width, board.height);

    ctx.strokeStyle = 'var(--grid-line)';
    ctx.strokeStyle = '#262a3a';
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL, 0);
      ctx.lineTo(x * CELL, ROWS * CELL);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL);
      ctx.lineTo(COLS * CELL, y * CELL);
      ctx.stroke();
    }

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (grid[y][x]) drawCell(ctx, x, y, grid[y][x], CELL);
      }
    }

    if (current) {
      for (const [x, y] of absCells(current)) {
        if (y >= 0) drawCell(ctx, x, y, current.type, CELL);
      }
    }
  }

  function drawNext() {
    nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    const cells = SHAPES[nextType];
    const size = 20;
    const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
    const w = (Math.max(...xs) - Math.min(...xs) + 1) * size;
    const h = (Math.max(...ys) - Math.min(...ys) + 1) * size;
    const offX = (nextCanvas.width - w) / 2 - Math.min(...xs) * size;
    const offY = (nextCanvas.height - h) / 2 - Math.min(...ys) * size;
    for (const [cx, cy] of cells) {
      nextCtx.fillStyle = COLORS[nextType];
      nextCtx.fillRect(offX + cx * size + 1, offY + cy * size + 1, size - 2, size - 2);
    }
  }

  function showOverlay(title, btnLabel) {
    overlayTitle.textContent = title;
    overlayBtn.textContent = btnLabel;
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function loop(time) {
    if (!running) return;
    if (!paused) {
      if (time - lastTime > dropInterval) {
        lastTime = time;
        softDrop();
      }
      draw();
    }
    rafId = requestAnimationFrame(loop);
  }

  function startGame() {
    if (gameOver || !current) resetState();
    running = true;
    paused = false;
    gameOver = false;
    lastTime = performance.now();
    hideOverlay();
    drawNext();
    draw();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      showOverlay('Paused', 'Resume');
    } else {
      hideOverlay();
      lastTime = performance.now();
    }
  }

  overlayBtn.addEventListener('click', startGame);

  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') e.preventDefault();
    if (!running && (e.key === 'Enter' || e.key === ' ')) {
      startGame();
      return;
    }
    if (!running || paused) {
      if (e.key.toLowerCase() === 'p') togglePause();
      return;
    }
    switch (e.key) {
      case 'ArrowLeft': move(-1, 0); draw(); break;
      case 'ArrowRight': move(1, 0); draw(); break;
      case 'ArrowDown': softDrop(); draw(); break;
      case 'ArrowUp': rotate(); draw(); break;
      case ' ': hardDrop(); draw(); break;
      case 'p': case 'P': togglePause(); break;
    }
  });

  resetState();
  draw();
  drawNext();
  showOverlay('Tetris', 'Start');
})();
</script>
</body>
</html>
